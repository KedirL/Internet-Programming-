<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
</head>
<body>
    <header>

    </header>
    <main>

            <section>
                <h3>Send Me Message</h3>
                <form action="thank-you.html" method="get">
                    <fieldset>
                        <legend>Your Details </legend>
                        <label for="fullname"> Name:</label>
                            <input type="text" name="fullname" id="fullname">
                        
                        <br><br>
                        <label for="email">Email: </label>
                            <input type="email" name="email" id="email">
                            <br><br>
                            <label for="message">Enter Your Message</label><br>
                            <textarea name="message" id="message" width="600" height="auto"></textarea><br><br>
                            <label for="submit">
                                <button type="submit">Send Message</button>
                            </label>
                    </fieldset>
                </form>
                <div>
                    <h1>Thank you!</h1>
                    <p>Your message has been sent. I will reply within two days.</p>
                    <p>Look at the address bar: the data you typed is in the URL.</p>
                    <p><a href="index.html">← Back to Home</a></p>
                </div>
            </section>
    </main>
    <footer>

    </footer>
</body>
</html>
